<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&family=Overpass+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;background:#F7F5EF;font-family:Overpass,sans-serif;color:#1B1B1F;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:28px 56px;border-bottom:3px solid #1B1B1F}
.logo{display:flex;align-items:center;gap:14px;font-weight:900;font-size:26px;letter-spacing:.04em}
.roundel{width:38px;height:38px;border-radius:50%;border:7px solid #E8542F;position:relative}
.roundel:after{content:"";position:absolute;left:-12px;right:-12px;top:5px;height:9px;background:#1E9E6A}
.who{font-family:'Overpass Mono';font-size:14px;color:#55555c}
.who b{color:#1B1B1F}
nav{display:flex;gap:10px}
nav span{font-weight:700;font-size:14px;padding:8px 16px;border:2px solid #1B1B1F;border-radius:30px}
nav span.on{background:#1B1B1F;color:#F7F5EF}
svg text{font-family:Overpass}
.mono{font-family:'Overpass Mono'}
.bottom{position:absolute;left:56px;right:56px;top:730px;display:grid;grid-template-columns:240px 1fr 1fr 1fr 1fr;gap:28px;align-items:end;border-top:3px solid #1B1B1F;padding-top:22px}
.bottom h3{font-weight:900;font-size:22px;line-height:1.1}
.bottom h3 small{display:block;font-family:'Overpass Mono';font-weight:400;font-size:12px;color:#66666d;margin-top:6px;letter-spacing:.05em}
.stat .lbl{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between}
.bar{height:14px;border-radius:7px;background:#E4E1D8;margin-bottom:7px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.bar em{position:absolute;right:-34px;top:-3px;font-style:normal;font-family:'Overpass Mono';font-size:13px;font-weight:600}
.a i{background:#E8542F}.b i{background:#1E9E6A}
.stat{padding-right:40px}
</style></head><body>
