<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lifelines · Every life has a fork</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050508;overflow:hidden;color:#EDE9F5;font-family:Inter,system-ui,sans-serif}
.bg{position:fixed;inset:0;background:
 radial-gradient(ellipse 55% 45% at 78% 28%,rgba(130,80,220,.16),transparent 70%),
 radial-gradient(ellipse 45% 40% at 15% 105%,rgba(255,120,70,.12),transparent 70%)}
.stage{position:fixed;inset:0;perspective:1150px;perspective-origin:38% 42%}
.track{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.card{position:absolute;left:0;top:0;width:230px;height:310px;transform-style:preserve-3d;cursor:pointer;will-change:transform,opacity}
.card.wide{width:360px;height:250px}
.img{position:absolute;inset:0;overflow:hidden;background:#000;transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s;box-shadow:0 40px 70px -25px rgba(0,0,0,.95)}
.img svg{width:100%;height:100%;display:block}
.img:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}
.idx{position:absolute;left:0;top:-15px;font:600 9px/1 'JetBrains Mono',monospace;color:#8b8698;letter-spacing:.12em}
.cap{position:absolute;left:58%;bottom:20%;display:flex;align-items:center;gap:8px;font:600 9px/1 'JetBrains Mono',monospace;letter-spacing:.16em;color:#fff;white-space:nowrap;transform:translateZ(1px);text-shadow:0 1px 6px #000}
.cap:before{content:"";width:56px;height:1px;background:rgba(255,255,255,.85)}
.seam{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:linear-gradient(#FF8A5C,#3DFFC0);box-shadow:0 0 14px #fff;opacity:0;transform:scaleY(0);transition:.45s cubic-bezier(.2,.8,.2,1)}
.choice{position:absolute;bottom:10px;font:600 9px/1 'JetBrains Mono',monospace;letter-spacing:.14em;padding:5px 7px;border-radius:6px;opacity:0;transition:.4s .05s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.choice.a{left:10px;color:#FFB79A;background:rgba(255,138,92,.18);border:1px solid rgba(255,138,92,.5);transform:translateX(8px)}
.choice.b{right:10px;color:#9EFFDC;background:rgba(61,255,192,.14);border:1px solid rgba(61,255,192,.45);transform:translateX(-8px)}
.hit{position:absolute;inset:-10px}
.card:hover .img{transform:translateZ(40px);box-shadow:0 50px 90px -20px rgba(0,0,0,1),0 0 0 1px rgba(255,255,255,.25)}
.card:hover .seam{opacity:1;transform:scaleY(1)}
.card:hover .choice{opacity:1;transform:none}
/* overlay UI */
.ui{position:fixed;inset:0;pointer-events:none;z-index:5}
.logo{position:absolute;left:56px;top:36px;display:flex;align-items:center;gap:10px;font:800 13px/1 Inter;letter-spacing:.22em}
.logo i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ff8a5c 40%,#7a1f3d);box-shadow:8px 0 0 -2px #3DFFC0,0 0 14px rgba(255,138,92,.6)}
h1{position:absolute;left:52px;top:78px;font-family:'Instrument Serif',serif;font-weight:400;font-size:92px;line-height:.9;letter-spacing:-.02em}
h1 em{color:#E9C27A}
.sub{position:absolute;left:58px;top:282px;font:500 11px/1.7 'JetBrains Mono',monospace;letter-spacing:.14em;color:#9a94aa;max-width:330px}
.sub b{color:#fff;font-weight:600}
.hint{position:absolute;right:56px;bottom:38px;font:600 10px/1 'JetBrains Mono',monospace;letter-spacing:.18em;color:#cfc9dc}
.now{position:absolute;left:58px;bottom:34px;display:flex;align-items:baseline;gap:14px}
.now .n{font:600 11px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#8b8698}
.now .t{font-family:'Instrument Serif';font-style:italic;font-size:28px;color:#fff}
.now .q{font:500 12px Inter;color:#bdb6cc}
.prog{position:absolute;left:58px;bottom:84px;width:220px;height:1px;background:rgba(255,255,255,.15)}
.prog i{position:absolute;left:0;top:-1px;height:3px;background:#fff;width:20px;transition:left .2s}
/* detail */
.detail{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(3,3,6,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .4s}
.detail.on{opacity:1;pointer-events:auto}
.sheet{display:grid;grid-template-columns:360px 380px;gap:44px;align-items:center;transform:translateY(20px) scale(.97);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.detail.on .sheet{transform:none}
.sheet .big{width:360px;height:480px;overflow:hidden;box-shadow:0 60px 120px -30px #000;position:relative}
.sheet .big svg{width:100%;height:100%}
.sheet .k{font:600 10px 'JetBrains Mono',monospace;letter-spacing:.18em;color:#8b8698}
.sheet h2{font-family:'Instrument Serif';font-weight:400;font-size:58px;line-height:.95;margin:12px 0 14px}
.sheet p{font-size:15px;line-height:1.6;color:#cbc4da}
.opts{display:flex;gap:10px;margin:26px 0 18px}
.opts span{flex:1;padding:14px 12px;border-radius:14px;font-weight:600;font-size:14px;text-align:center}
.opts .a{background:linear-gradient(180deg,rgba(255,138,92,.4),rgba(255,90,60,.15));border:1px solid rgba(255,160,120,.6)}
.opts .b{background:linear-gradient(180deg,rgba(61,255,192,.3),rgba(20,180,130,.12));border:1px solid rgba(120,255,210,.5)}
.enter{display:inline-block;padding:13px 20px;border-radius:14px;background:#fff;color:#14101f;font-weight:650;font-size:14px}
.close{position:absolute;top:30px;right:40px;font:600 11px 'JetBrains Mono';letter-spacing:.16em;color:#aaa;cursor:pointer}
</style></head><body>
<div class="bg"></div>
<div class="stage"><div class="track" id="track"></div></div>
<div class="ui">
 <div class="logo"><i></i>&nbsp;LIFELINES</div>
 <h1>Every life<br>has a <em>fork.</em></h1>
 <div class="sub"><b>12 PEOPLE · 12 DILEMMAS.</b><br>PICK ONE. WATCH BOTH LIVES PLAY OUT, SIDE BY SIDE, WITH THE SAME LUCK.</div>
 <div class="prog"><i id="pi"></i></div>
 <div class="now"><span class="n" id="nn">01 / 12</span><span class="t" id="nt">Maya, 24</span><span class="q" id="nq">Tokyo job, or stay home?</span></div>
 <div class="hint">SCROLL TO BROWSE LIVES · CLICK TO ENTER</div>
</div>
<div class="detail" id="detail"><div class="close" id="close">✕ CLOSE</div><div class="sheet"><div class="big" id="dimg"></div><div>
 <div class="k" id="dk"></div><h2 id="dh"></h2><p id="dp"></p>
 <div class="opts"><span class="a" id="da"></span><span class="b" id="db"></span></div>
 <span class="enter">Enter both lives →</span></div></div></div>
<script>
const S=[
 {n:'Maya',a:24,q:'Tokyo job, or stay home?',A:'Go to Tokyo',B:'Stay home',cap:'TOKYO / HOME',l:'#ff9a4a',l2:'#3ad7ff',env:'neon',f:1,hair:1,p:'A design studio in Tokyo wants her. Her grandmother\'s bakery needs someone.'},
 {n:'Arjun',a:18,q:'Medicine, or music?',A:'Medical school',B:'The band',cap:'MED / MUSIC',l:'#ff5a7a',l2:'#ffb36b',env:'bokeh',f:-1,p:'His parents saved for med school. His band just got its first real gig.'},
 {n:'Lena',a:31,q:'A child now, or the company first?',A:'Start a family',B:'Build the company',cap:'NOW / LATER',l:'#ffd27a',l2:'#ff7a3d',env:'window',f:1,hair:1,p:'Her startup just raised money. Her partner is ready for a baby.'},
 {n:'Sam',a:40,q:'Quit the bank to build furniture?',A:'Quit',B:'Stay safe',cap:'SAFE / CRAFT',l:'#4fd8ff',l2:'#2a6bff',env:'horizon',f:-1,wide:1,full:1,p:'Twenty years in finance. A garage full of half-finished chairs.'},
 {n:'Zara',a:22,q:'Marry your first love, or travel alone?',A:'Marry',B:'Travel',cap:'STAY / WANDER',l:'#ff6ad5',l2:'#7a5cff',env:'blinds',f:1,hair:1,p:'He proposed. She also bought a one-way ticket to Lima last week.'},
 {n:'Kenji',a:55,q:'Retire early, or one last big project?',A:'Retire',B:'One more',cap:'REST / BUILD',l:'#ffb050',l2:'#ff5a2a',env:'bokeh',f:-1,p:'The bridge project would take five years. His knees say no.'},
 {n:'Priya',a:27,q:'Move back to care for her parents?',A:'Move back',B:'Stay in London',cap:'HOME / AWAY',l:'#7affc8',l2:'#3ad7ff',env:'window',f:-1,hair:1,p:'Her father\'s health is slipping. Her career just took off.'},
 {n:'Omar',a:35,q:'Take the buyout, or keep going?',A:'Sell',B:'Keep going',cap:'SELL / GROW',l:'#ff4a4a',l2:'#ff9a4a',env:'neon',f:1,wide:1,full:1,p:'A giant offers to buy his app. He thinks it could be bigger.'},
 {n:'Elena',a:19,q:'University, or the family farm?',A:'University',B:'The farm',cap:'CITY / SOIL',l:'#ffcf6b',l2:'#ff8a3d',env:'horizon',f:1,hair:1,full:1,wide:1,p:'A scholarship in the city. Three generations of olive trees.'},
 {n:'Theo',a:29,q:'Tell his best friend how he feels?',A:'Say it',B:'Stay quiet',cap:'SAY / KEEP',l:'#9a7aff',l2:'#ff6ad5',env:'blinds',f:-1,p:'Ten years of friendship. One sentence could change everything.'},
 {n:'Ama',a:45,q:'Start over in a new country?',A:'Leave',B:'Stay',cap:'NEW / KNOWN',l:'#3ad7ff',l2:'#7affc8',env:'bokeh',f:1,hair:1,p:'Kids grown, job stale. A friend in Lisbon has a spare room.'},
 {n:'Ravi',a:33,q:'Bet his savings on a restaurant?',A:'Open it',B:'Keep saving',cap:'RISK / REST',l:'#ff8a3d',l2:'#ffd27a',env:'window',f:-1,p:'His food stall has a queue every night. The lease costs everything.'},
];
const NS='http://www.w3.org/2000/svg';
const PROFILE='M70 260C70 212 80 196 96 188C93 175 89 162 87 152C71 141 62 116 66 90C70 56 100 40 125 47C146 54 156 72 155 89L161 105L169 119L159 123C161 129 159 133 157 135C159 141 155 147 148 149C140 151 135 151 131 153C131 163 133 173 141 182C161 190 186 201 200 222L200 260Z';
const HAIR='M68 82C52 120 56 190 78 236L102 206C93 174 90 140 93 110Z';
const BODY='M50 0a11 11 0 1 1 0.1 0ZM40 24C36 40 35 60 37 78L39 120L45 120L49 82L53 82L56 120L62 120L64 78C66 60 64 40 60 24Z';
let seed=11;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
function scene(s,i,big){
 const W=s.wide&&!big?400:300,H=s.wide&&!big?280:400,id='s'+i+(big?'b':'');const f=s.f;
 const lx=f>0?W*.82:W*.18, ly=H*.32;
 let g=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="${NS}"><defs>
 <radialGradient id="${id}L" cx="${lx/W}" cy="${ly/H}" r=".85"><stop offset="0" stop-color="${s.l}" stop-opacity=".85"/><stop offset=".35" stop-color="${s.l}" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
 <radialGradient id="${id}V" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></radialGradient>
 <filter id="${id}b2"><feGaussianBlur stdDeviation="2"/></filter><filter id="${id}b6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter><filter id="${id}b14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter></defs>
 <rect width="${W}" height="${H}" fill="#07060a"/><rect width="${W}" height="${H}" fill="url(#${id}L)"/>`;
 if(s.env==='neon'){g+=`<g filter="url(#${id}b6)"><path d="M${W*-.1} ${H*.78} L${W*1.1} ${H*.6}" stroke="${s.l2}" stroke-width="10"/><path d="M${W*-.1} ${H*.86} L${W*1.1} ${H*.72}" stroke="#ff3a4a" stroke-width="6" opacity=".8"/></g><path d="M${W*-.1} ${H*.78} L${W*1.1} ${H*.6}" stroke="#fff" stroke-width="2" opacity=".9"/>`;}
 if(s.env==='bokeh'){g+=`<g filter="url(#${id}b6)">`;for(let k=0;k<16;k++)g+=`<circle cx="${R()*W}" cy="${R()*H*.7}" r="${6+R()*16}" fill="${R()<.5?s.l:s.l2}" opacity="${(.25+R()*.45).toFixed(2)}"/>`;g+='</g>';}
 if(s.env==='blinds'){g+=`<g filter="url(#${id}b2)" opacity=".55" transform="skewY(-14)">`;for(let k=0;k<9;k++)g+=`<rect x="${f>0?W*.35:-W*.1}" y="${H*.05+k*H*.1}" width="${W*.8}" height="${H*.04}" fill="${s.l}"/>`;g+='</g>';}
 if(s.env==='window'){const wx=f>0?W*.58:W*.08;g+=`<rect x="${wx}" y="${H*.1}" width="${W*.34}" height="${H*.46}" fill="${s.l}" opacity=".85" filter="url(#${id}b2)"/><rect x="${wx+W*.165}" y="${H*.1}" width="${W*.012}" height="${H*.46}" fill="#07060a"/><rect x="${wx}" y="${H*.32}" width="${W*.34}" height="${H*.012}" fill="#07060a"/><rect x="${wx-20}" y="${H*.05}" width="${W*.34+40}" height="${H*.56}" fill="${s.l}" opacity=".35" filter="url(#${id}b14)"/>`;}
 if(s.env==='horizon'){g+=`<rect y="0" width="${W}" height="${H*.62}" fill="${s.l2}" opacity=".18"/><circle cx="${lx}" cy="${H*.56}" r="${H*.12}" fill="${s.l}" filter="url(#${id}b6)"/><circle cx="${lx}" cy="${H*.56}" r="${H*.09}" fill="#fff" opacity=".85"/><rect y="${H*.6}" width="${W}" height="${H*.4}" fill="#050407"/><rect y="${H*.595}" width="${W}" height="2" fill="${s.l}" opacity=".8"/>`;}
 // glow
 g+=`<ellipse cx="${lx}" cy="${ly}" rx="${W*.35}" ry="${H*.3}" fill="${s.l}" opacity=".18" filter="url(#${id}b14)"/>`;
 // figure
 const dx=-6*f; // dark body shifted away from light
 if(s.full){const sc=H/400*1.1, fx=f>0?W*.38:W*.55, fy=H*.6-120*sc*1.0;
  const tr=`translate(${fx},${fy}) scale(${sc})`;
  g+=`<g transform="${tr}"><path d="${BODY}" fill="${s.l}" filter="url(#${id}b2)" opacity=".95"/><path d="${BODY}" fill="#040306" transform="translate(${dx*.4},0)"/></g>`;
 } else {
  const sc=H/260*.9, fx=f>0?W*.5-112*sc:W*.5+112*sc, fy=H-260*sc;
  const tr=`translate(${fx},${fy}) scale(${f>0?sc:-sc},${sc})`;
  const parts=(s.hair?`<path d="${HAIR}"/>`:'')+`<path d="${PROFILE}"/>`;
  g+=`<g transform="${tr}"><g fill="${s.l}" filter="url(#${id}b6)" opacity=".7">${parts}</g><g fill="${s.l}" filter="url(#${id}b2)">${parts}</g><g fill="#040306" transform="translate(-5,1)">${parts}</g></g>`;
 }
 g+=`<rect width="${W}" height="${H}" fill="url(#${id}V)"/></svg>`;return g;}

const track=document.getElementById('track');
const cards=S.map((s,i)=>{const c=document.createElement('div');c.className='card'+(s.wide?' wide':'');
 c.innerHTML=`<div class="idx">${String(i+1).padStart(2,'0')}</div><div class="img">${scene(s,i)}<div class="seam"></div><span class="choice a">A · ${s.A.toUpperCase()}</span><span class="choice b">B · ${s.B.toUpperCase()}</span></div><div class="cap">${s.cap}</div><div class="hit"></div>`;
 c.onclick=()=>openD(i);c.onmouseenter=()=>hover=true;c.onmouseleave=()=>hover=false;track.appendChild(c);return c;});
const N=S.length;let off=0,target=0,hover=false,last=-1;
addEventListener('wheel',e=>{target+=e.deltaY*.0022;},{passive:true});
function frame(){
 if(!hover&&!document.getElementById('detail').classList.contains('on'))target+=.0016;
 off+=(target-off)*.075;
 const Wd=innerWidth,Hd=innerHeight;
 cards.forEach((c,i)=>{let t=((i-off)%N+N)%N;if(t>N-2.2)t-=N;
  const w=c.offsetWidth,h=c.offsetHeight;
  const x=Wd*.22+t*Wd*.12, y=Hd*.86-h-t*Hd*.056, z=-t*230+40;
  const op=t<-.75?0:t<-.1?(t+.75)/.65:t>7?Math.max(0,1-(t-7)/2.5):1;
  c.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateY(-26deg)`;c.style.opacity=op.toFixed(3);
  c.style.pointerEvents=op>.5?'auto':'none';});
 const cur=((Math.round(off)%N)+N)%N;
 if(cur!==last){last=cur;const s=S[cur];document.getElementById('nn').textContent=String(cur+1).padStart(2,'0')+' / '+N;
  document.getElementById('nt').textContent=s.n+', '+s.a;document.getElementById('nq').textContent=s.q;
  document.getElementById('pi').style.left=(cur/(N-1)*200)+'px';}
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
function openD(i){const s=S[i];document.getElementById('dimg').innerHTML=scene(s,i,true);
 document.getElementById('dk').textContent=`STORY ${String(i+1).padStart(2,'0')} · AGE ${s.a}`;
 document.getElementById('dh').innerHTML=`${s.n}: <em style="color:#E9C27A">${s.q}</em>`;document.getElementById('dp').textContent=s.p;
 document.getElementById('da').textContent='A · '+s.A;document.getElementById('db').textContent='B · '+s.B;
 document.getElementById('detail').classList.add('on');}
document.getElementById('close').onclick=()=>document.getElementById('detail').classList.remove('on');
window.__open=openD;
</script></body></html>
