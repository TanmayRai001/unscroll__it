<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;position:relative;font-family:Inter,sans-serif;color:#F4F1FA;
 background:linear-gradient(180deg,#070A1C 0%,#141238 26%,#3A1F5C 42%,#8A4A78 52%,#E8A07A 58%,#2a1a3a 60%,#120d26 100%)}
#sky{position:absolute;inset:0;background:
 radial-gradient(ellipse 380px 120px at 1180px 230px,rgba(255,90,170,.45),transparent 70%),
 radial-gradient(ellipse 500px 160px at 260px 240px,rgba(255,190,120,.25),transparent 70%)}
#stars{position:absolute;inset:0 0 60% 0}
svg#s{position:absolute;inset:0}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.24);
 backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
 box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 18px 40px -12px rgba(0,0,0,.55)}
header{position:absolute;top:22px;left:40px;right:40px;height:60px;border-radius:20px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 20px;z-index:10}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:19px;letter-spacing:.14em}
.orb{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ff8a5c 35%,#7a1f3d 75%);box-shadow:0 0 18px rgba(255,120,80,.7);position:relative}
.orb:after{content:"";position:absolute;left:14px;top:6px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#3dffc0 35%,#0b5a48 75%);mix-blend-mode:screen;box-shadow:0 0 18px rgba(60,255,190,.6)}
.who{font-size:13px;color:#d8d2ea}.who b{color:#fff;font-weight:600}
.who i{font-family:'Instrument Serif';font-size:16px;color:#fff}
nav{display:flex;gap:8px}
nav span{font-size:13px;font-weight:600;padding:9px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.18);color:#e9e4f5}
nav span.on{background:rgba(255,255,255,.9);color:#1a1430}
#cards{position:absolute;inset:0;z-index:5}
.card{position:absolute;transform-origin:50% 100%;border-radius:14px;padding:10px 13px 11px;width:max-content;max-width:200px}
.card .age{font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.14em;font-weight:600;display:flex;align-items:center;gap:6px}
.card .age:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.card h4{font-size:15px;font-weight:650;margin-top:4px;letter-spacing:-.01em}
.card q{display:block;font-family:'Instrument Serif';font-style:italic;font-size:17px;line-height:1.2;color:#efe9ff;margin-top:5px;quotes:"“" "”"}
.card.chip{padding:7px 11px;border-radius:11px}.card.chip h4{font-size:13px;margin-top:2px}
.A .age{color:#FF8A5C}.B .age{color:#3DFFC0}.S .age{color:#C9C3FF}
.warn{display:inline-block;margin-left:6px;font-size:10px;padding:1px 6px;border-radius:6px;background:rgba(255,196,60,.2);color:#FFC43C;border:1px solid rgba(255,196,60,.5);letter-spacing:.08em}
.fork{width:250px;max-width:none;text-align:left}
.fork .pills{display:flex;gap:8px;margin-top:10px}
.fork .pills span{flex:1;text-align:center;font-size:12.5px;font-weight:650;padding:7px 0;border-radius:10px}
.pA{background:linear-gradient(180deg,rgba(255,138,92,.55),rgba(255,90,60,.25));border:1px solid rgba(255,160,120,.7)}
.pB{background:linear-gradient(180deg,rgba(61,255,192,.4),rgba(20,180,130,.2));border:1px solid rgba(120,255,210,.6)}
.tag{position:absolute;font-family:'JetBrains Mono';font-size:11px;font-weight:600;letter-spacing:.14em;padding:6px 11px;border-radius:999px;transform:translate(-50%,-50%);white-space:nowrap}
.report{position:absolute;left:40px;right:40px;bottom:18px;height:84px;border-radius:20px;z-index:10;display:grid;grid-template-columns:220px repeat(4,1fr) 170px;gap:26px;align-items:center;padding:0 22px}
.report h3{font-family:'Instrument Serif';font-weight:400;font-size:30px;line-height:1}
.report h3 small{display:block;font-family:'JetBrains Mono';font-size:10px;letter-spacing:.14em;color:#bdb5d6;margin-top:6px}
.st .l{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#cfc8e6;margin-bottom:7px}
.st .l b{font-family:'JetBrains Mono';font-weight:600;letter-spacing:0}
.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.1);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.ba i{background:linear-gradient(90deg,#c2412a,#FF8A5C);box-shadow:0 0 10px #ff8a5c}
.bb i{background:linear-gradient(90deg,#11a77a,#3DFFC0);box-shadow:0 0 10px #3dffc0}
.run{justify-self:end;font-weight:650;font-size:14px;padding:13px 18px;border-radius:14px;background:rgba(255,255,255,.92);color:#1a1430;box-shadow:0 0 30px rgba(255,255,255,.25)}
</style></head><body>
<div id="sky"></div><svg id="stars" width="1440" height="360"></svg>
<svg id="s" width="1440" height="900" viewBox="0 0 1440 900"></svg>
<div id="cards"></div>
<header class="glass">
 <div class="logo"><div class="orb"></div>&nbsp;&nbsp;LIFELINES</div>
 <div class="who">Traveller <b>Maya Okafor</b> · curious, cautious, loyal · <i>one life, two lines</i></div>
 <nav><span class="on">3D Map</span><span>Story</span><span>Compare</span></nav>
</header>
<div class="report glass">
 <h3>At forty-five<small>SAME PERSON · SAME LUCK · SEED 4127</small></h3>
 <div class="st"><div class="l"><span>Wealth</span><b><span style="color:#FF8A5C">82</span> · <span style="color:#3DFFC0">47</span></b></div><div class="bar ba"><i style="width:82%"></i></div><div class="bar bb"><i style="width:47%"></i></div></div>
 <div class="st"><div class="l"><span>Happiness</span><b><span style="color:#FF8A5C">58</span> · <span style="color:#3DFFC0">79</span></b></div><div class="bar ba"><i style="width:58%"></i></div><div class="bar bb"><i style="width:79%"></i></div></div>
 <div class="st"><div class="l"><span>Health</span><b><span style="color:#FF8A5C">61</span> · <span style="color:#3DFFC0">72</span></b></div><div class="bar ba"><i style="width:61%"></i></div><div class="bar bb"><i style="width:72%"></i></div></div>
 <div class="st"><div class="l"><span>Love</span><b><span style="color:#FF8A5C">40</span> · <span style="color:#3DFFC0">88</span></b></div><div class="bar ba"><i style="width:40%"></i></div><div class="bar bb"><i style="width:88%"></i></div></div>
 <div class="run">▶ Ride both lines</div>
</div>
<script>
const W=1440, NS='http://www.w3.org/2000/svg';
const C={h:500,z0:-850,th:14,f:800}; const HOR=290; C.hy=HOR+C.f*Math.tan(C.th*Math.PI/180);
const cs=Math.cos(C.th*Math.PI/180), sn=Math.sin(C.th*Math.PI/180);
function P(x,y,z){const Y=y-C.h,Z=z-C.z0;const zc=-Y*sn+Z*cs,yc=Y*cs+Z*sn;return {x:W/2+C.f*x/zc,y:C.hy-C.f*yc/zc,k:C.f/zc};}
const svg=document.getElementById('s');
document.body.style.background=`linear-gradient(180deg,#070A1C 0px,#141238 ${HOR-200}px,#3A1F5C ${HOR-90}px,#8A4A78 ${HOR-35}px,#E8A07A ${HOR}px,#1a1236 ${HOR+1}px,#100b22 900px)`;
document.getElementById('sky').style.background=`radial-gradient(ellipse 380px 110px at 1060px ${HOR-10}px,rgba(255,90,170,.5),transparent 70%),radial-gradient(ellipse 520px 140px at 300px ${HOR}px,rgba(255,190,120,.25),transparent 70%)`;
function el(t,a,p=svg){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}
const poly=(pts)=>pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
// defs
const defs=el('defs',{});
defs.innerHTML=`
<filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="blur12" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
<filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<linearGradient id="slabTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9a8ff" stop-opacity=".05"/><stop offset=".55" stop-color="#9c8cff" stop-opacity=".12"/><stop offset="1" stop-color="#d9d0ff" stop-opacity=".22"/></linearGradient>
<linearGradient id="slabFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".15" stop-color="#cfc4ff" stop-opacity=".25"/><stop offset="1" stop-color="#5a4a9a" stop-opacity=".12"/></linearGradient>
<radialGradient id="oA" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#ffd2bd"/><stop offset=".6" stop-color="#ff7a48" stop-opacity=".85"/><stop offset="1" stop-color="#7a1f1a" stop-opacity=".95"/></radialGradient>
<radialGradient id="oB" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#c8fff0"/><stop offset=".6" stop-color="#2ee6a8" stop-opacity=".85"/><stop offset="1" stop-color="#064a3a" stop-opacity=".95"/></radialGradient>
<radialGradient id="oS" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#e2ddff"/><stop offset=".65" stop-color="#9a8cff" stop-opacity=".85"/><stop offset="1" stop-color="#2a1f6a" stop-opacity=".95"/></radialGradient>
<radialGradient id="oW" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="slice" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".02"/><stop offset="1" stop-color="#fff" stop-opacity=".16"/></linearGradient><linearGradient id="fog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2050" stop-opacity=".95"/><stop offset="1" stop-color="#3a2050" stop-opacity="0"/></linearGradient>`;
// stars
const st=document.getElementById('stars');let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let i=0;i<120;i++){const c=document.createElementNS(NS,'circle');c.setAttribute('cx',rnd()*1440);c.setAttribute('cy',rnd()*300);c.setAttribute('r',rnd()*1.2+.2);c.setAttribute('fill','#fff');c.setAttribute('opacity',(rnd()*.6+.15).toFixed(2));st.appendChild(c);}

// distant hills on horizon
el('path',{d:`M0 ${HOR+8} Q180 ${HOR-30} 360 ${HOR-6} T720 ${HOR-14} T1080 ${HOR-4} T1440 ${HOR-22} V${HOR+40} H0Z`,fill:'#2b1a44',opacity:.9});
el('path',{d:`M0 ${HOR+14} Q240 ${HOR-6} 480 ${HOR+6} T960 ${HOR+2} T1440 ${HOR+4} V${HOR+40} H0Z`,fill:'#1d1336'});

// time mapping
const T=[[0,-700],[18,-560],[22,-440],[24,-320],[26,-200],[30,-30],[34,130],[38,270],[45,480],[47,560]];
function X(a){for(let i=1;i<T.length;i++){if(a<=T[i][0]){const [a0,x0]=T[i-1],[a1,x1]=T[i];return x0+(x1-x0)*(a-a0)/(a1-a0);}}return T[T.length-1][1];}
const ZS=400, ZA=760, ZB=60, R=10, TY=12;

// ground slab
const sx0=-1000,sx1=1000,sz0=-70,sz1=2600,th=30;
const g=[P(sx0,0,sz0),P(sx1,0,sz0),P(sx1,0,sz1),P(sx0,0,sz1)];
el('polygon',{points:poly(g),fill:'#1a1236',opacity:.85});
el('polygon',{points:poly(g),fill:'url(#slabTop)'});
// grid
for(let x=-1000;x<=1000;x+=80){const a=P(x,0,sz0),b=P(x,0,sz1);el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#cbbcff','stroke-opacity':.07});}
for(let z=sz0;z<=1600;z+=70){const a=P(sx0,0,z),b=P(sx1,0,z);el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#cbbcff','stroke-opacity':.03+0.09*(1-(z-sz0)/1700)});}
// front edge of slab
const f1=P(sx0,0,sz0),f2=P(sx1,0,sz0),f3=P(sx1,-th,sz0),f4=P(sx0,-th,sz0);
el('polygon',{points:poly([f1,f2,f3,f4]),fill:'url(#slabFront)'});
el('line',{x1:f1.x,y1:f1.y,x2:f2.x,y2:f2.y,stroke:'#fff','stroke-opacity':.7,'stroke-width':1.5});
// fog at far end
const fg=[P(sx0,0,sz1),P(sx1,0,sz1),P(sx1,0,1100),P(sx0,0,1100)];
el('polygon',{points:poly(fg),fill:'url(#fog)',opacity:.6});

// ground glows under worlds
function glow(x,z,rx,color,op){const p=P(x,0,z);el('ellipse',{cx:p.x,cy:p.y,rx:rx*p.k,ry:rx*p.k*.28,fill:color,opacity:op,filter:'url(#blur12)'});}
glow(700,900,420,'#ff4fa0',.35); glow(800,170,320,'#ffb36b',.4); glow(X(24),ZS,260,'#a99cff',.3);

// cuboid helper (glass buildings)
function cuboid(x,z,w,d,h,col,opts={}){
 const pts=(yy)=>[P(x,yy,z),P(x+w,yy,z),P(x+w,yy,z+d),P(x,yy,z+d)];
 const b=pts(0),t=pts(h);
 // shadow
 const sh=[P(x+8,0,z+6),P(x+w+40,0,z+6),P(x+w+40,0,z+d+30),P(x+8,0,z+d+30)];
 el('polygon',{points:poly(sh),fill:'#000',opacity:.28,filter:'url(#blur6)'});
 const front=[b[0],b[1],t[1],t[0]];
 const side = (x+w/2)>0 ? [b[0],b[3],t[3],t[0]] : [b[1],b[2],t[2],t[1]];
 el('polygon',{points:poly(side),fill:col.side,'fill-opacity':.55,stroke:'#fff','stroke-opacity':.25});
 el('polygon',{points:poly(front),fill:col.front,'fill-opacity':.5,stroke:'#fff','stroke-opacity':.4});
 el('polygon',{points:poly(t),fill:col.top,'fill-opacity':.6,stroke:'#fff','stroke-opacity':.55});
 // windows on front face
 if(opts.win){for(let yy=opts.win[1];yy<h-10;yy+=opts.win[1]+6)for(let xx=6;xx<w-8;xx+=opts.win[0]+6){
   if(rnd()<.3)continue;const q=[P(x+xx,yy,z),P(x+xx+opts.win[0],yy,z),P(x+xx+opts.win[0],yy+opts.win[1],z),P(x+xx,yy+opts.win[1],z)];
   el('polygon',{points:poly(q),fill:opts.wc||'#ffe3a8',opacity:(.5+rnd()*.5).toFixed(2)});}}
 return {t,front};
}
function roof(x,z,w,d,h,rh,col){ // gable roof along x
 const a=P(x,h,z),b=P(x+w,h,z),c=P(x+w,h+rh,z+d/2),dd=P(x,h+rh,z+d/2),e=P(x,h,z+d),f=P(x+w,h,z+d);
 const gable=(x+w/2)>0?[a,dd,e]:[b,c,f];
 el('polygon',{points:poly(gable),fill:col,'fill-opacity':.7,stroke:'#fff','stroke-opacity':.3});
 el('polygon',{points:poly([a,b,c,dd]),fill:col,'fill-opacity':.85,stroke:'#fff','stroke-opacity':.45});
}
function tree(x,z,h){const b=P(x,0,z),t=P(x,h,z);el('ellipse',{cx:b.x+6*b.k,cy:b.y,rx:18*b.k,ry:5*b.k,fill:'#000',opacity:.3,filter:'url(#blur3)'});
 el('line',{x1:b.x,y1:b.y,x2:t.x,y2:t.y,stroke:'#6b4a3a','stroke-width':3*b.k});
 el('circle',{cx:t.x,cy:t.y-10*t.k,r:20*t.k,fill:'#3ddc97','fill-opacity':.55,stroke:'#c8ffe6','stroke-opacity':.5});
 el('circle',{cx:t.x-6*t.k,cy:t.y-16*t.k,r:6*t.k,fill:'#fff',opacity:.35});}

// TOKYO world (behind line A end)
const tokyo=[[600,880,60,60,300],[690,840,55,55,220],[530,930,50,50,180],[770,900,70,60,380],[860,850,50,50,210],[670,980,60,50,270],[580,820,40,40,120],[850,990,55,50,250],[950,930,50,50,160]];
tokyo.sort((p,q)=>q[1]-p[1]);
for(const [x,z,w,d,h] of tokyo) cuboid(x,z,w,d,h,{front:'#ff5aa8',side:'#7a2a9a',top:'#ffc2e4'},{win:[7,9],wc:'#ffd9f0'});
// neon sign
{const p=P(805,400,900);el('rect',{x:p.x-4,y:p.y-30,width:8,height:30,fill:'#4ff0ff',opacity:.9,filter:'url(#blur3)'});}

// HOMETOWN world (beyond line B end)
const town=[[700,140,70,60,55,'#ffb36b'],[800,110,60,55,48,'#ff9a6b'],[900,190,70,60,60,'#ffc27a'],[760,260,55,50,45,'#ffb36b']];
town.sort((p,q)=>q[1]-p[1]);
for(const [x,z,w,d,h,c] of town){cuboid(x,z,w,d,h,{front:'#ffe2b8',side:'#c27a4a',top:'#fff'},{win:[10,12],wc:'#ffcf6b'});roof(x-4,z-4,w+8,d+8,h,34,c==='#ffc27a'?'#e0563a':'#c2452d');}
tree(660,100,60);tree(1000,130,70);tree(1010,250,55);tree(880,85,50);

// tubes
function tube(pts,col){
 // pts: [[x,z],...] world; sample segments
 const seg=[];for(let i=1;i<pts.length;i++){const [x0,z0]=pts[i-1],[x1,z1]=pts[i];const n=Math.max(2,Math.ceil(Math.hypot(x1-x0,z1-z0)/25));
  for(let j=0;j<n;j++){const t0=j/n,t1=(j+1)/n;seg.push([x0+(x1-x0)*t0,z0+(z1-z0)*t0,x0+(x1-x0)*t1,z0+(z1-z0)*t1]);}}
 const layer=(y,wm,attrs,dy=0,dx=0,dz=0)=>{const gg=el('g',attrs);for(const [a,b,c,d] of seg){const p=P(a+dx,y,b+dz),q=P(c+dx,y,d+dz);const k=(p.k+q.k)/2;
   el('line',{x1:p.x,y1:p.y+dy*k,x2:q.x,y2:q.y+dy*k,'stroke-width':(wm*R*k).toFixed(2),'stroke-linecap':'round'},gg);}return gg;};
 layer(0,2.6,{stroke:'#000','stroke-opacity':.45,filter:'url(#blur6)'},0,10,-14);
 layer(0,5,{stroke:col.glow,'stroke-opacity':.22,filter:'url(#blur12)'},0,0,0);
 layer(TY,2,{stroke:col.rim,'stroke-opacity':.95});
 layer(TY,1.55,{stroke:col.deep,'stroke-opacity':.62});
 layer(TY,.45,{stroke:col.core,'stroke-opacity':.95,filter:'url(#blur3)'});
 layer(TY,.35,{stroke:col.core,'stroke-opacity':1});
 layer(TY,.32,{stroke:'#fff','stroke-opacity':.85},-0.55*R);
}
const cS={glow:'#a99cff',rim:'#d8d2ff',deep:'#2c2270',core:'#e6e1ff'};
const cA={glow:'#ff6a3d',rim:'#ffb79a',deep:'#7a1f14',core:'#ffd0b8'};
const cB={glow:'#2ee6a8',rim:'#9effdc',deep:'#06503d',core:'#c8fff0'};
// back to front: A, shared, B
tube([[X(24)+20,ZS],[X(25.7),ZA],[X(46),ZA]],cA);
tube([[X(0)-40,ZS],[X(24),ZS]],cS);
tube([[X(24)+20,ZS],[X(24.75),ZB],[X(46),ZB]],cB);

// time-slice glass plane at age 34
{const x=X(34)+0;const q=[P(x,0,-40),P(x,0,900),P(x,110,900),P(x,110,-40)];
 el('polygon',{points:poly(q),fill:'url(#slice)',stroke:'#fff','stroke-opacity':.25});
 const top=P(x,190,330); el('line',{x1:q[3].x,y1:q[3].y,x2:q[2].x,y2:q[2].y,stroke:'#fff','stroke-opacity':.45,'stroke-width':1});
}

// orbs
function orb(x,z,grad,rad=15,glowc){const s=P(x,0,z),p=P(x,TY+4,z);
 el('ellipse',{cx:s.x+6*s.k,cy:s.y,rx:rad*1.3*s.k,ry:rad*.4*s.k,fill:'#000',opacity:.45,filter:'url(#blur3)'});
 if(glowc)el('circle',{cx:p.x,cy:p.y,r:rad*2.2*p.k,fill:glowc,opacity:.35,filter:'url(#blur6)'});
 el('circle',{cx:p.x,cy:p.y,r:rad*p.k,fill:`url(#${grad})`,stroke:'#fff','stroke-opacity':.6,'stroke-width':1});
 el('ellipse',{cx:p.x-rad*.35*p.k,cy:p.y-rad*.45*p.k,rx:rad*.35*p.k,ry:rad*.2*p.k,fill:'#fff',opacity:.85});
 return p;}
function stem(x,z,h,col,dx=0){const a=P(x,TY+18,z),b=P(x,h,z);b.x+=dx;el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:col,'stroke-opacity':.55,'stroke-width':1.2});
